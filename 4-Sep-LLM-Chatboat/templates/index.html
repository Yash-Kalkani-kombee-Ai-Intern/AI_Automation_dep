
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Chatbot</h1>
        <p class="subtitle">Powered by Gemini</p>

        <!-- Session ID -->
        <div class="session-section">

            <label for="sessionId">Session ID</label>

            <div class="session-row">

                <input
                    type="text"
                    id="sessionId"
                    value="user123"
                    placeholder="Enter Session ID"
                >

                <button onclick="changeSession()">
                    Change Session
                </button>

            </div>

            <p id="sessionStatus">
                Current session: user123
            </p>

        </div>

        <!-- Chat Box -->
        <div id="chatBox" class="chat-box">

            <div class="message assistant">
                <strong>AI:</strong>
                Hello! How can I help you?
            </div>

        </div>

        <!-- Message Input -->
        <div class="input-section">

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

        <!-- Clear Chat -->
        <button class="clear-btn" onclick="clearChat()">
            Clear Chat
        </button>

    </div>


    <script>

        // -----------------------------------------
        // Current Session
        // -----------------------------------------

        let currentSession = "user123";


        // -----------------------------------------
        // Change Session
        // -----------------------------------------

        function changeSession() {

            const newSession =
                document.getElementById("sessionId").value.trim();

            if (newSession === "") {

                alert("Please enter a Session ID.");

                return;
            }

            currentSession = newSession;

            document.getElementById("sessionStatus").innerText =
                "Current session: " + currentSession;

            // Clear old UI messages
            document.getElementById("chatBox").innerHTML = "";

            // Load history of selected session
            loadHistory();

        }


        // -----------------------------------------
        // Send Message
        // -----------------------------------------

        async function sendMessage() {

            const input =
                document.getElementById("messageInput");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            addMessage("You", message);

            input.value = "";

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        session_id: currentSession,

                        message: message

                    })

                });


                const data = await response.json();

                if (response.ok) {

                    addMessage("AI", data.response);

                } else {

                    addMessage(
                        "AI",
                        "Error: " + (data.detail || "Something went wrong")
                    );

                }

            } catch (error) {

                addMessage(
                    "AI",
                    "Server connection error."
                );

                console.error(error);
            }

        }


        // -----------------------------------------
        // Add Message to UI
        // -----------------------------------------

        function addMessage(sender, message) {

            const chatBox =
                document.getElementById("chatBox");

            const messageDiv =
                document.createElement("div");

            messageDiv.className =
                sender === "AI"
                ? "message assistant"
                : "message user";

            const strongTag = document.createElement("strong");
            strongTag.textContent = sender + ": ";
            messageDiv.appendChild(strongTag);

            const textNode = document.createTextNode(message);
            messageDiv.appendChild(textNode);

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        // -----------------------------------------
        // Load Session History
        // -----------------------------------------

        async function loadHistory() {

            try {

                const response = await fetch(
                    `/chat/${currentSession}/history`
                );

                const data = await response.json();

                const chatBox =
                    document.getElementById("chatBox");

                chatBox.innerHTML = "";

                if (data.history.length === 0) {

                    addMessage(
                        "AI",
                        "New conversation started!"
                    );

                    return;
                }


                data.history.forEach(item => {

                    if (item.role === "user") {

                        addMessage(
                            "You",
                            item.message
                        );

                    } else {

                        addMessage(
                            "AI",
                            item.message
                        );

                    }

                });

            } catch (error) {

                console.error(error);

            }

        }


        // -----------------------------------------
        // Clear Current Session
        // -----------------------------------------

        async function clearChat() {

            try {

                await fetch(
                    `/chat/${currentSession}`,
                    {
                        method: "DELETE"
                    }
                );

                document.getElementById("chatBox").innerHTML = "";

                addMessage(
                    "AI",
                    "Chat cleared. New conversation started!"
                );

            } catch (error) {

                console.error(error);

            }

        }


        // -----------------------------------------
        // Enter Key
        // -----------------------------------------

        function handleEnter(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }

    </script>

</body>

</html>
